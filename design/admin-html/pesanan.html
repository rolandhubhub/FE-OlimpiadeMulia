<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kelola Pesanan — Panel Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&family=Baloo+2:wght@500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --border:#c9c3d2; --sidebar-active:#eadce4; --table-head:#eadce4; --orange:#f98a02; --purple-dark:#2b1245; --pink:#ba5187; --maroon:#9c1457; --text-gray:#7a7686; --red:#b3261e; --teal:#1f7a4d; }
    *{box-sizing:border-box;} body{margin:0; font-family:'Poppins',sans-serif; color:var(--purple-dark); background:#fff;} .layout{display:flex; min-height:100vh;} .sidebar{width:220px; flex-shrink:0; background:#fff; border-right:1px solid #eee; padding:28px 0;} .brand{padding:0 24px 22px;} .brand h1{margin:0 0 4px; font-family:'Lora',serif; font-size:21px; font-weight:600; letter-spacing:.03em;} .brand p{margin:0; font-size:11px; font-weight:700; letter-spacing:.05em; color:var(--pink);} nav{display:flex; flex-direction:column; margin-top:4px;} .nav-item{display:flex; align-items:center; gap:12px; padding:10px 24px; color:var(--text-gray); text-decoration:none; font-family:'Baloo 2',sans-serif; font-size:14px; font-weight:600; border-left:3px solid transparent;} .nav-item svg{width:16px; height:16px; flex-shrink:0;} .nav-item.active{background:var(--sidebar-active); color:var(--purple-dark); border-left-color:var(--orange);} main{flex:1; padding:46px 34px 50px; min-width:0;} h1{margin:0 0 4px; font-family:'Lora',serif; font-size:26px; font-weight:600;} .page-sub{margin:0 0 18px; font-size:12px; color:var(--pink); font-weight:600;} .filter-bar{display:flex; gap:12px; align-items:center; margin-bottom:18px;} .filter-bar input, .filter-bar select{border:1px solid var(--border); border-radius:4px; padding:10px 14px; font-size:13px; font-family:'Baloo 2',sans-serif; color:var(--purple-dark); outline:none; background:#fff;} .filter-bar input{flex:1; max-width:280px;} .filter-bar select{max-width:220px;} table{width:100%; border-collapse:collapse; border:1px solid var(--border); font-size:12px;} thead th{background:var(--table-head); text-align:left; padding:10px 12px; font-family:'Baloo 2',sans-serif; font-weight:700; color:var(--purple-dark);} tbody td{padding:10px 12px; border-top:1px solid #ededed; vertical-align:middle; color:var(--purple-dark);} .order-no{font-weight:700;} .sub{display:block; color:var(--text-gray); font-size:11px; margin-top:2px;} .badge{display:inline-block; padding:4px 10px; border-radius:4px; font-size:11px; font-weight:600; font-family:'Baloo 2',sans-serif;} .badge.waiting{background:#fdf0dc; color:#c17d12;} .badge.completed{background:#deebe5; color:#2f7a56;} .badge.cancelled{background:#fbdede; color:#c0423b;} .table-foot{text-align:right; font-size:11px; color:var(--text-gray); margin-top:10px; font-family:'Baloo 2',sans-serif;} @media (max-width:760px){ .layout{flex-direction:column;} .sidebar{width:100%;} nav{flex-direction:row; overflow-x:auto;} .filter-bar{flex-direction:column; align-items:stretch;} .filter-bar input, .filter-bar select{max-width:100%;} table{display:block; overflow-x:auto;} }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="brand"><h1>INTAN MUTIA</h1><p>PANEL ADMIN</p></div>
      <nav>
        <a class="nav-item" href="dashboard.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="9" rx="1"></rect><rect x="14" y="3" width="7" height="5" rx="1"></rect><rect x="14" y="12" width="7" height="9" rx="1"></rect><rect x="3" y="16" width="7" height="5" rx="1"></rect></svg>Dashboard</a>
        <a class="nav-item" href="event.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="17" rx="2"></rect><path d="M8 2v4M16 2v4M3 10h18"></path></svg>Event</a>
        <a class="nav-item" href="peserta.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="3.2"></circle><path d="M5 20c0-3.3 3.1-6 7-6s7 2.7 7 6"></path></svg>Peserta</a>
        <a class="nav-item" href="nominasi.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 2l2.6 6.6L21 9l-5 4.5L17.4 21 12 17.3 6.6 21 8 13.5 3 9l6.4-.4z"></path></svg>Nominasi &amp; Sertifikat</a>
        <a class="nav-item" href="buku.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="3" width="16" height="18" rx="1"></rect><path d="M8 8h8M8 12h8M8 16h5"></path></svg>Buku</a>
        <a class="nav-item active" href="pesanan.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 7h12l-1 13H7z"></path><path d="M9 7V5a3 3 0 0 1 6 0v2"></path></svg>Pesanan</a>
        <a class="nav-item" href="transaksi.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="7" width="18" height="12" rx="2"></rect><path d="M7 7V5h10v2"></path><path d="M8 12h8"></path></svg>Transaksi</a>
        <a class="nav-item" href="pengguna.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"></circle><path d="M4 20c0-4.4 3.6-8 8-8s8 3.6 8 8"></path></svg>Pengguna</a>
      </nav>
    </aside>

    <main>
      <p class="eyebrow" style="margin:0 0 4px; font-size:12px; font-weight:700; color:var(--pink);">Kelola Pesanan</p>
      <h1>Kelola Pesanan</h1>
      <p class="page-sub">Kelola Toko Buku</p>

      <div class="filter-bar">
        <input id="searchPesanan" type="text" placeholder="Cari Nama">
        <select id="statusFilter">
          <option value="">Semua Status</option>
          <option value="Menunggu Bayar">Menunggu Bayar</option>
          <option value="Completed">Completed</option>
          <option value="Cancelled">Cancelled</option>
        </select>
      </div>

      <table>
        <thead>
          <tr>
            <th>No</th>
            <th>No. Pesanan</th>
            <th>Penerima</th>
            <th>Total</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="pesananTableBody"></tbody>
      </table>
      <div class="table-foot" id="pesananFoot">0 data, Halaman 1/1</div>
    </main>
  </div>

  <script>
    const pesananData = [
      { no: 1, order: 'ORD-20261014-0024', penerima: 'Hana Maulana', city: 'Malang', total: 80000, status: 'Menunggu Bayar' },
      { no: 2, order: 'ORD-20261014-0025', penerima: 'Rizky Pratama', city: 'Bandung', total: 150000, status: 'Completed' },
      { no: 3, order: 'ORD-20261014-0026', penerima: 'Aisyah Putri', city: 'Yogyakarta', total: 120000, status: 'Completed' },
      { no: 4, order: 'ORD-20261014-0027', penerima: 'Dimas Wibowo', city: 'Surabaya', total: 95000, status: 'Cancelled' },
      { no: 5, order: 'ORD-20261014-0028', penerima: 'Nabila Sari', city: 'Semarang', total: 130000, status: 'Menunggu Bayar' },
      { no: 6, order: 'ORD-20261014-0029', penerima: 'Galih Alexander', city: 'Bekasi', total: 110000, status: 'Completed' },
      { no: 7, order: 'ORD-20261014-0030', penerima: 'Zahra Ramadhani', city: 'Medan', total: 90000, status: 'Cancelled' }
    ];

    function escapeHtml(value) { return String(value ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;'); }
    function renderPesanan() {
      const search = document.getElementById('searchPesanan').value.trim().toLowerCase();
      const status = document.getElementById('statusFilter').value;
      const rows = pesananData.filter(item => {
        const matchText = !search || item.penerima.toLowerCase().includes(search) || item.city.toLowerCase().includes(search);
        const matchStatus = !status || item.status === status;
        return matchText && matchStatus;
      });
      const body = document.getElementById('pesananTableBody');
      body.innerHTML = rows.length ? rows.map((item, idx) => `
        <tr>
          <td>${idx + 1}</td>
          <td><span class="order-no">${escapeHtml(item.order)}</span><span class="sub">${escapeHtml(item.no)} Okt 2026</span></td>
          <td><span class="order-no">${escapeHtml(item.penerima)}</span><span class="sub">${escapeHtml(item.city)}</span></td>
          <td>Rp ${Number(item.total).toLocaleString('id-ID')}</td>
          <td><span class="badge ${item.status === 'Menunggu Bayar' ? 'waiting' : item.status === 'Completed' ? 'completed' : 'cancelled'}">${escapeHtml(item.status)}</span></td>
        </tr>
      `).join('') : '<tr><td colspan="5" style="padding:18px; text-align:center; color:var(--text-gray);">Tidak ada data</td></tr>';
      document.getElementById('pesananFoot').textContent = `${rows.length} data, Halaman 1/1`;
    }

    document.getElementById('searchPesanan').addEventListener('input', renderPesanan);
    document.getElementById('statusFilter').addEventListener('change', renderPesanan);
    renderPesanan();
  </script>
</body>
</html>
