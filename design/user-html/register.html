<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar - Buat Akun</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .font-serif-custom {
      font-family: 'Playfair Display', Georgia, serif;
    }
  </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-0 m-0">

  <div class="w-full min-h-screen grid grid-cols-1 lg:grid-cols-2 bg-white">
    
    <!-- Sisi Kiri: Hero Banner dengan Overlay -->
    <div class="relative min-h-[400px] lg:min-h-screen bg-cover bg-center flex items-center p-8 sm:p-12 lg:p-20"
         style="background-image: url('https://images.unsplash.com/photo-1577896851231-70ef18881754?q=80&w=1600&auto=format&fit=crop');">
      
      <!-- Purple/Navy Dark Overlay -->
      <div class="absolute inset-0 bg-[#1e1742] opacity-85"></div>

      <!-- Konten Teks Kiri -->
      <div class="relative z-10 max-w-lg text-white space-y-3">
        <p class="text-[#e05638] font-bold text-xs sm:text-sm tracking-wider uppercase">
          SELAMAT DATANG
        </p>
        <h1 class="font-serif-custom text-3xl sm:text-4xl lg:text-5xl font-semibold leading-tight text-white">
          Mulai Langkah Juaramu.
        </h1>
      </div>
    </div>

    <!-- Sisi Kanan: Form Pendaftaran -->
    <div class="flex items-center justify-center p-8 sm:p-12 lg:p-16 bg-white">
      <div class="w-full max-w-md space-y-5">
        
        <!-- Header Form -->
        <div class="space-y-1">
          <p class="text-[#9e1c4e] font-bold text-xs tracking-widest uppercase">
            DAFTAR
          </p>
          <h2 class="font-serif-custom text-3xl font-bold text-[#1a1333]">
            Buat Akun
          </h2>
        </div>

        <!-- Form Input -->
        <form class="space-y-4" onsubmit="event.preventDefault();">
          
          <!-- Field Nama Lengkap -->
          <div class="space-y-1">
            <label for="fullname" class="block text-xs font-semibold text-gray-500">
              Nama Lengkap
            </label>
            <input 
              type="text" 
              id="fullname" 
              placeholder="Masukan Nama Lengkap..." 
              class="w-full px-3.5 py-2.5 border border-gray-300 rounded-none text-sm text-gray-700 placeholder-gray-300 focus:outline-none focus:border-[#1a1333]"
            />
          </div>

          <!-- Field Email -->
          <div class="space-y-1">
            <label for="email" class="block text-xs font-semibold text-gray-500">
              Email
            </label>
            <input 
              type="email" 
              id="email" 
              placeholder="Masukan Alamat Email..." 
              class="w-full px-3.5 py-2.5 border border-gray-300 rounded-none text-sm text-gray-700 placeholder-gray-300 focus:outline-none focus:border-[#1a1333]"
            />
          </div>

          <!-- Field Kata Sandi -->
          <div class="space-y-1">
            <label for="password" class="block text-xs font-semibold text-gray-500">
              Kata Sandi
            </label>
            <input 
              type="password" 
              id="password" 
              placeholder="Masukan Kata Sandi..." 
              class="w-full px-3.5 py-2.5 border border-gray-300 rounded-none text-sm text-gray-700 placeholder-gray-300 focus:outline-none focus:border-[#1a1333]"
            />
          </div>

          <!-- Field Konfirmasi Kata Sandi -->
          <div class="space-y-1">
            <label for="confirm-password" class="block text-xs font-semibold text-gray-500">
              Konfirmasi Kata Sandi
            </label>
            <input 
              type="password" 
              id="confirm-password" 
              placeholder="Konfirmasi Kata Sandi..." 
              class="w-full px-3.5 py-2.5 border border-gray-300 rounded-none text-sm text-gray-700 placeholder-gray-300 focus:outline-none focus:border-[#1a1333]"
            />
          </div>

          <!-- Tombol Daftar -->
          <button 
            type="submit" 
            class="w-full py-3 mt-2 bg-[#1c1236] text-white text-xs font-bold tracking-wider uppercase hover:bg-[#2a1c50] transition-colors duration-200">
            DAFTAR
          </button>
        </form>

        <!-- Footer Form Link -->
        <div class="text-xs text-gray-400 pt-1">
          <span>Sudah punya akun? </span>
          <a href="#" class="text-[#9e1c4e] font-bold hover:underline">Masuk</a>
        </div>

      </div>
    </div>

  </div>

</body>
</html>
